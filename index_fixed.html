<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Life Detector</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 20px;
        }

        #status {
            margin: 15px;
            color: #00ffff;
            font-size: 20px;
        }

        #camera-container {
            position: relative;
            width: 90%;
            max-width: 900px;
            margin: auto;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 0 30px #00ffff;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #detected {
            margin: 20px auto;
            padding: 15px;
            width: 85%;
            max-width: 600px;
            background: #111;
            border-radius: 15px;
            text-align: left;
            box-sizing: border-box;
        }

        #result {
            font-size: 18px;
            line-height: 1.7;
        }

        .error {
            color: #ff5555;
        }

        .ok {
            color: #00ff88;
        }
    </style>
</head>

<body>

    <h1>🤖 AI Life Detector</h1>

    <div id="status">📷 Mengaktifkan kamera...</div>

    <div id="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="detected">
        <h2>🔎 Terdeteksi</h2>
        <div id="result">Menunggu AI...</div>
    </div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const result = document.getElementById("result");

let model = null;
let detecting = false;


// ===============================
// AKTIFKAN KAMERA
// ===============================

async function startCamera() {
    try {
        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
            throw new Error("Browser tidak mendukung kamera");
        }

        statusText.innerText = "📷 Meminta izin kamera...";

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        });

        video.srcObject = stream;

        await new Promise(resolve => {
            video.onloadedmetadata = resolve;
        });

        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        statusText.innerText = "🟢 Kamera aktif | 🧠 Memuat AI...";

        await loadAI();

    } catch (error) {
        console.error(error);

        statusText.innerHTML =
            '<span class="error">❌ Kamera gagal diaktifkan</span>';

        result.innerHTML =
            "Izinkan akses kamera pada browser.<br><br>" +
            "Jika izin sudah diberikan, coba refresh halaman.";
    }
}


// ===============================
// LOAD AI
// ===============================

async function loadAI() {
    try {
        statusText.innerText = "🧠 Memuat model AI...";

        // Pastikan TensorFlow sudah siap
        await tf.ready();

        // Load COCO-SSD
        model = await cocoSsd.load();

        statusText.innerHTML =
            '<span class="ok">🟢 AI aktif — Mendeteksi objek...</span>';

        result.innerHTML = "Arahkan kamera ke manusia atau objek.";

        detect();

    } catch (error) {
        console.error("AI ERROR:", error);

        statusText.innerHTML =
            '<span class="error">❌ Model AI gagal dimuat</span>';

        result.innerHTML =
            "Model AI tidak berhasil dimuat.<br>" +
            "Pastikan internet aktif lalu refresh halaman.";
    }
}


// ===============================
// DETEKSI OBJEK
// ===============================

async function detect() {

    if (!model || detecting) {
        requestAnimationFrame(detect);
        return;
    }

    // Tunggu kamera siap
    if (video.readyState < 2) {
        requestAnimationFrame(detect);
        return;
    }

    detecting = true;

    try {
        const predictions = await model.detect(video);

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const count = {};

        predictions.forEach(prediction => {

            // Hanya tampilkan deteksi dengan confidence minimal 50%
            if (prediction.score < 0.50) return;

            const [x, y, width, height] = prediction.bbox;

            const name = prediction.class;
            const confidence =
                Math.round(prediction.score * 100);

            count[name] = (count[name] || 0) + 1;

            // Kotak
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 3;

            ctx.strokeRect(
                x,
                y,
                width,
                height
            );

            // Background teks
            ctx.fillStyle = "#00ffff";

            ctx.fillRect(
                x,
                Math.max(0, y - 32),
                190,
                32
            );

            // Teks
            ctx.fillStyle = "#000";
            ctx.font = "bold 16px Arial";

            ctx.fillText(
                `${name} ${confidence}%`,
                x + 6,
                Math.max(20, y - 10)
            );
        });

        // Tampilkan hasil
        if (Object.keys(count).length === 0) {

            result.innerHTML =
                "Belum ada objek yang terdeteksi.";

        } else {

            result.innerHTML =
                Object.entries(count)
                    .map(([name, jumlah]) =>
                        `🔹 <b>${name}</b> : ${jumlah}`
                    )
                    .join("<br>");
        }

    } catch (error) {
        console.error("DETECT ERROR:", error);
    }

    detecting = false;

    // Jalankan deteksi lagi
    requestAnimationFrame(detect);
}


// ===============================
// MULAI
// ===============================

startCamera();

</script>

</body>
</html>
